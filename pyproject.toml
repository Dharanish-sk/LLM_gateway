[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "intelligent-llm-gateway"
version = "0.1.0"
description = "An observable OpenAI-compatible gateway with calibrated caching and routing"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "httpx>=0.28,<1",
  "redis>=5.2,<7",
  "pydantic>=2.10,<3",
  "PyYAML>=6.0,<7",
  "numpy>=1.26,<3",
  "prometheus-client>=0.21,<1",
  "opentelemetry-sdk>=1.29,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.29,<2",
]

[project.optional-dependencies]
eval = ["scikit-learn>=1.5,<2", "psutil>=6,<8", "jsonschema>=4.23,<5"]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<2", "fakeredis[lua]>=2.26,<3", "ruff>=0.9,<1"]

[project.scripts]
gateway = "gateway.cli:main"
gateway-eval = "experiments.cli:main"

[tool.setuptools.packages.find]
include = ["gateway*", "experiments*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["E501"]
